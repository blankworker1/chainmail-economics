<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chainmail game</title>
<style>
:root{
  --bg:#E4E8EB; --panel:#F6F7F8; --ink:#1E2A32; --muted:#5A6873; --line:#C3CAD0; --shock:#B5410A;
  --font:"Gill Sans","Gill Sans MT","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:28px;padding:8px 20px;background:var(--panel)}
header.top h1{font-size:26px;margin:0;font-weight:600;letter-spacing:.01em}
.round{font-size:20px}
.round b{font-size:26px;font-weight:600}
.status{font-size:19px;color:var(--ink);min-height:2em;padding:5px 20px;border-top:1px solid var(--line);border-bottom:2px solid var(--ink);background:var(--panel)}
.status.shock{color:var(--shock);font-weight:600}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(420px,29vw,560px)}
.board-wrap{min-height:0;min-width:0;padding:12px;display:flex;align-items:center;justify-content:center}
#board{width:100%;height:100%;max-height:calc(100vh - 130px)}
aside{border-left:2px solid var(--ink);background:var(--panel);overflow-y:auto;padding:14px 16px 40px}
section.blk{padding:12px 0;border-bottom:1px solid var(--line)}
section.blk:first-child{padding-top:0}
h2{font-size:19px;margin:0 0 8px;font-weight:600}
p{margin:0 0 8px}
.hint{color:var(--muted);font-size:15px}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{background:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #0072B2;outline-offset:2px}
button.on{background:var(--ink);color:#fff}
button.primary{background:var(--ink);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cardform input.uname{flex:1;min-width:8ch;width:auto;font-size:20px;letter-spacing:0;text-align:left}
.cardform input{width:8.5ch;font-size:24px;letter-spacing:.12em;padding:4px 8px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;text-align:center}
.err{color:var(--shock);font-size:15px;min-height:1.2em;margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border:1.5px solid var(--ink);border-radius:20px;background:#fff;cursor:pointer}
.chip.on{background:var(--ink);color:#fff}
.chip.out{opacity:.45;cursor:default}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);font-weight:600;font-size:15px;color:var(--ink)}
.nbr{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;background:#fff}
.nbr .head{display:flex;align-items:center;gap:8px;justify-content:space-between}
.nbr .head b{font-size:19px}
.nbr .advice{font-size:15px;color:var(--muted);margin:4px 0}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:15px}
.bar{height:12px;background:#E3E7EA;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.figs{flex:1;display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:flex-end}
.fig{display:flex;align-items:baseline;gap:8px}
.fig span{font-size:16px;color:var(--muted)}
.fig b{font-size:26px;font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:15px}
.legend div{display:flex;align-items:center;gap:8px}
details summary{cursor:pointer;font-size:19px;font-weight:600}
label{display:flex;align-items:center;gap:8px;margin:8px 0}
svg text{font-family:var(--font)}
.b-bg{fill:#F6F7F8}
.b-grid{stroke:#C3CAD0;stroke-width:1.5}
.b-lab{fill:#5A6873;font-size:26px;text-anchor:middle;dominant-baseline:central}
.b-let{fill:#1E2A32;font-size:30px;font-weight:600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
[data-act]{cursor:pointer}
@media (max-width:1000px){main{grid-template-columns:1fr}aside{border-left:0;border-top:2px solid var(--ink)}#board{max-height:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Chainmail</h1>
  <div class="round">Round <b id="rnd">1</b></div>
  <div class="figs" id="figs"></div>
</header>
<div id="status" class="status" role="status" aria-live="polite"></div>
<main>
  <section class="board-wrap"><svg id="board" role="img" aria-label="Game board"></svg></section>
  <aside>
    <section class="blk">
      <h2>New card</h2>
      <p class="hint">Username, then five digits from 0 to 9 in the order E F L M S. A message sent from the card page can be pasted into either box.</p>
      <div class="row cardform">
        <input id="uname" class="uname" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Username" placeholder="username">
        <input id="card" inputmode="numeric" maxlength="5" autocomplete="off" aria-label="Card as five digits" placeholder="37250">
        <button id="addcard" class="primary">Add card</button>
      </div>
      <div id="carderr" class="err"></div>
      <div id="tie"></div>
    </section>
    <section class="blk" id="p-turn"></section>
    <section class="blk" id="p-tools"></section>
    <section class="blk" id="p-unit"></section>
    <section class="blk" id="p-figs"></section>
    <section class="blk">
      <h2>Reading the board</h2>
      <div class="legend" id="legend"></div>
    </section>
    <section class="blk">
      <details>
        <summary>Setup and saving</summary>
        <label>Board size
          <select id="size"><option value="9">9 by 9</option><option value="11" selected>11 by 11</option><option value="13">13 by 13</option><option value="15">15 by 15</option></select>
        </label>
        <p class="hint">Changing the size starts a new game.</p>
        <label>Automatic shock
          <select id="autoshock"><option value="0">Off</option><option value="5">About every 5 minutes</option><option value="10">About every 10 minutes</option><option value="15">About every 15 minutes</option><option value="20">About every 20 minutes</option></select>
        </label>
        <div class="row" style="margin:10px 0">
          <button id="sample">Add 8 sample cards</button>
          <button id="export">Save to file</button>
          <button id="importbtn">Load from file</button>
          <input type="file" id="import" accept="application/json,.json" hidden>
        </div>
        <div class="row"><button id="newgame">Start a new game</button></div>
        <p class="hint" style="margin-top:8px">The game also saves itself in this browser after every action.</p>
      </details>
    </section>
  </aside>
</main>
<script>
(function(){
'use strict';
var ATTR=[
 {k:'E',name:'Energy',c:'#E69F00',t:'#F3CF80',p:'#FBEFD5'},
 {k:'F',name:'Food',c:'#009E73',t:'#80CFB9',p:'#D5EFE8'},
 {k:'L',name:'Land',c:'#CC79A7',t:'#E6BCD3',p:'#F6E8F0'},
 {k:'M',name:'Money',c:'#F0E442',t:'#F7F1A0',p:'#FCFADF'},
 {k:'S',name:'Skills',c:'#0072B2',t:'#80B9D9',p:'#D5E8F3'}
];
var STORE='chainmail-game-v1';
var S,undo=[];
var ui={pasteDom:-1,asker:null,place:null,dec:{},mode:'select',sel:null,alone:false,pending:null,bondPick:null,msg:'',shockMsg:false,nextShock:0,confirmNew:false};
var $=function(id){return document.getElementById(id)};
function fresh(n){return {n:n||11,round:1,links:{},bonds:{},queue:[],history:[],broke:{},shock:0,nextId:1}}
function key(c,r){return c+','+r}
function xy(k){return k.split(',').map(Number)}
function cellName(k){var p=xy(k);return String.fromCharCode(65+p[0])+(p[1]+1)}
function nb(k){var p=xy(k),c=p[0],r=p[1];return [[c,r-1],[c+1,r],[c,r+1],[c-1,r]].filter(function(q){return q[0]>=0&&q[1]>=0&&q[0]<S.n&&q[1]<S.n}).map(function(q){return key(q[0],q[1])})}
function bk(a,b){return a<b?a+'|'+b:b+'|'+a}
function bonded(a,b){return !!S.bonds[bk(a,b)]}
function occn(k){return nb(k).filter(function(n){return S.links[n]})}
function bn(k){return nb(k).filter(function(n){return S.links[n]&&bonded(k,n)})}
function linkKeys(){return Object.keys(S.links)}
function comps(skip){var seen={},n=0;linkKeys().forEach(function(s){if(s===skip||seen[s])return;n++;var q=[s];seen[s]=1;while(q.length){var cur=q.pop();bn(cur).forEach(function(m){if(m!==skip&&!seen[m]){seen[m]=1;q.push(m)}})}});return n}
function weakSet(){var base=comps(null),w={};linkKeys().forEach(function(k){if(bn(k).length>0&&comps(k)>base)w[k]=1});return w}
function strength(k){var b=bn(k);if(!b.length)return 1;var d=S.links[k].dom,sum=0;b.forEach(function(n){sum+=S.links[n].lv[d]});var avg=sum/b.length;return avg<3?2:avg<6?1:0}
function unit(k,extra){var m=[k].concat(bn(k)),sums=[0,0,0,0,0];m.forEach(function(x){S.links[x].lv.forEach(function(v,i){sums[i]+=v})});if(extra)extra.forEach(function(v,i){sums[i]+=v});return {members:m,sums:sums,dom:uniqueMax(sums)}}
function uniqueMax(a){var mx=Math.max.apply(null,a),idx=[];a.forEach(function(v,i){if(v===mx)idx.push(i)});return idx.length===1?idx[0]:-1}
function lowest(a){var mn=Math.min.apply(null,a);return a.indexOf(mn)}
function asker(){return S.queue.filter(function(q){return q.id===ui.asker})[0]||null}
function snap(){undo.push(JSON.stringify(S));if(undo.length>40)undo.shift()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function say(m,shock){ui.msg=m;ui.shockMsg=!!shock}
function nextAsker(){var q=S.queue.filter(function(x){return x.att<3})[0];ui.asker=q?q.id:null;ui.place=null;ui.dec={}}
function schedule(){ui.nextShock=S.shock>0?Date.now()+S.shock*60000*(0.5+Math.random()):0}
function cloths(){var lone=linkKeys().filter(function(k){return bn(k).length===0}).length;return comps(null)-lone}

function cleanName(v){return String(v||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').slice(0,32)}
function nameTaken(n){if(!n)return false;return S.queue.some(function(q){return q.name===n})||linkKeys().some(function(k){return S.links[k].name===n})}
function parseMsg(t){var m=/([a-z0-9._-]+)\s+([0-9]{5})(?:\s+strongest\s+([a-z]+))?/i.exec(t||'');if(!m)return null;var d=-1;if(m[3])ATTR.forEach(function(A,i){if(A.name.toLowerCase()===m[3].toLowerCase())d=i});return {name:cleanName(m[1]),digits:m[2],dom:d}}
function addCard(lv,dom,name){
  snap();
  name=name||'';
  if(linkKeys().length===0){
    var c=Math.floor(S.n/2),ck=key(c,c);
    S.links[ck]={lv:lv,dom:dom,name:name};
    say('First link placed at the centre, '+cellName(ck)+'.');
  }else{
    var q={id:S.nextId++,lv:lv,dom:dom,att:0,name:name};
    S.queue.push(q);
    if(!asker())ui.asker=q.id;
    say('Card added. '+ATTR[dom].name+' is its strongest attribute.');
  }
  commit();
}
function submitCard(){
  var v=$('card').value.trim(),err=$('carderr'),name=cleanName($('uname').value);
  if(!/^[0-9]{5}$/.test(v)){err.textContent='Enter five digits, one each for E, F, L, M, and S.';return}
  var lv=v.split('').map(Number);
  if(lv.every(function(x){return x===0})){err.textContent='At least one level must be above 0.';return}
  if(nameTaken(name)){err.textContent='The username '+name+' is already in the game. Ask for a different one.';return}
  err.textContent='';
  var mx=Math.max.apply(null,lv),ties=[];lv.forEach(function(x,i){if(x===mx)ties.push(i)});
  var hint=ui.pasteDom;ui.pasteDom=-1;
  $('card').value='';$('uname').value='';
  if(ties.length>1&&ties.indexOf(hint)<0){ui.pending={lv:lv,ties:ties,name:name};render()}
  else addCard(lv,ties.length>1?hint:ties[0],name);
  $('uname').focus();
}
function liftToQueue(k){var l=S.links[k];nb(k).forEach(function(n){delete S.bonds[bk(k,n)]});delete S.links[k];S.queue.push({id:S.nextId++,lv:l.lv,dom:l.dom,att:0,name:l.name||''});if(ui.sel===k)ui.sel=null}
function confirmPlace(){
  var a=asker();if(!a||!ui.place)return;
  var ns=occn(ui.place),yes=ns.filter(function(n){return ui.dec[n]===true});
  snap();
  if(yes.length){
    S.links[ui.place]={lv:a.lv,dom:a.dom,name:a.name||''};
    yes.forEach(function(n){S.bonds[bk(ui.place,n)]=1});
    S.queue=S.queue.filter(function(q){return q.id!==a.id});
    say('Link placed at '+cellName(ui.place)+' with '+yes.length+(yes.length===1?' bond.':' bonds.'));
    ui.sel=ui.place;nextAsker();
  }else{
    a.att++;
    if(a.att>=3){say('Three refusals. This link stays single until the next round.');nextAsker()}
    else{say('All refused. Attempt '+(a.att+1)+' of 3: choose a different place.');ui.place=null;ui.dec={}}
  }
  commit();
}
function placeAlone(k){var a=asker();if(!a)return;snap();S.links[k]={lv:a.lv,dom:a.dom,name:a.name||''};S.queue=S.queue.filter(function(q){return q.id!==a.id});say('Link set down alone at '+cellName(k)+'. Other single links can ask to join it.');ui.sel=k;ui.alone=false;nextAsker();commit()}
function breakBond(who){
  var p=ui.bondPick;if(!p)return;snap();
  delete S.bonds[bk(p.a,p.b)];S.broke[who]=1;
  var lifted=[];[p.a,p.b].forEach(function(k){if(S.links[k]&&bn(k).length===0){lifted.push(cellName(k));liftToQueue(k)}});
  say(cellName(who)+' broke the bond.'+(lifted.length?' '+lifted.join(' and ')+(lifted.length===1?' is':' are')+' single again.':''));
  ui.bondPick=null;if(!asker())nextAsker();commit();
}
function shock(auto){
  var ks=linkKeys();if(!ks.length)return;snap();
  var k=ks[Math.floor(Math.random()*ks.length)],nm=cellName(k);
  liftToQueue(k);
  say('Shock. The link at '+nm+' was removed and is single again.',true);
  if(!asker())nextAsker();
  if(auto)schedule();
  commit();
}
function nextRound(){snap();S.history.push({r:S.round,c:cloths()});S.round++;S.broke={};S.queue.forEach(function(q){q.att=0});if(!asker())nextAsker();say('Round '+S.round+' begins. Every link may break one bond this round.');commit()}
function doUndo(){if(!undo.length)return;S=JSON.parse(undo.pop());ui.place=null;ui.dec={};ui.bondPick=null;ui.pending=null;if(!asker())nextAsker();if(ui.sel&&!S.links[ui.sel])ui.sel=null;say('Last action undone.');save();render()}
function commit(){save();render()}

function ring(x,y,a,st,extra){
  var A=ATTR[a],band=st===2?A.c:st===1?A.t:A.p,dash=st===0?' stroke-dasharray="7 6"':'',ow=st===2?4:2.5,op=st===0?0.75:1;
  return '<g opacity="'+op+'"><circle cx="'+x+'" cy="'+y+'" r="27" fill="none" stroke="'+band+'" stroke-width="18"/>'+
    '<circle cx="'+x+'" cy="'+y+'" r="36" fill="none" stroke="#1E2A32" stroke-width="'+ow+'"'+dash+'/>'+
    '<circle cx="'+x+'" cy="'+y+'" r="18" fill="#F6F7F8" stroke="#1E2A32" stroke-width="1.5"/></g>'+
    '<text class="b-let" x="'+x+'" y="'+(y+1)+'">'+A.k+'</text>'+(extra||'');
}
function drawBoard(){
  var n=S.n,P=56,W=P+n*100+14,h='',i,k;
  function ctr(kk){var p=xy(kk);return [P+p[0]*100+50,P+p[1]*100+50]}
  h+='<rect class="b-bg" x="'+P+'" y="'+P+'" width="'+(n*100)+'" height="'+(n*100)+'"/>';
  for(i=0;i<=n;i++){h+='<line class="b-grid" x1="'+(P+i*100)+'" y1="'+P+'" x2="'+(P+i*100)+'" y2="'+(P+n*100)+'"/><line class="b-grid" x1="'+P+'" y1="'+(P+i*100)+'" x2="'+(P+n*100)+'" y2="'+(P+i*100)+'"/>'}
  for(i=0;i<n;i++){h+='<text class="b-lab" x="'+(P+i*100+50)+'" y="'+(P-26)+'">'+String.fromCharCode(65+i)+'</text><text class="b-lab" x="'+(P-28)+'" y="'+(P+i*100+50)+'">'+(i+1)+'</text>'}
  var weak=weakSet(),a=asker();
  if(ui.sel&&S.links[ui.sel]){var u=unit(ui.sel);u.members.forEach(function(m){var c=ctr(m);h+='<rect x="'+(c[0]-48)+'" y="'+(c[1]-48)+'" width="96" height="96" fill="'+(m===ui.sel?'#D9DEE2':'#E9ECEF')+'"/>'})}
  Object.keys(S.bonds).forEach(function(b){var p=b.split('|'),c1=ctr(p[0]),c2=ctr(p[1]),dx=Math.sign(c2[0]-c1[0]),dy=Math.sign(c2[1]-c1[1]);
    var x1=c1[0]+dx*36,y1=c1[1]+dy*36,x2=c2[0]-dx*36,y2=c2[1]-dy*36;
    h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#1E2A32" stroke-width="12"/>';
    if(ui.mode==='break')h+='<rect data-act="bond" data-a="'+p[0]+'" data-b="'+p[1]+'" x="'+(Math.min(x1,x2)-16)+'" y="'+(Math.min(y1,y2)-16)+'" width="'+(Math.abs(x2-x1)+32)+'" height="'+(Math.abs(y2-y1)+32)+'" fill="#0072B2" opacity="0.18" rx="6"/>'});
  linkKeys().forEach(function(k1){var p=xy(k1);[[p[0]+1,p[1]],[p[0],p[1]+1]].forEach(function(q){var k2=key(q[0],q[1]);if(!S.links[k2]||bonded(k1,k2))return;
    var c1=ctr(k1),c2=ctr(k2),dx=Math.sign(c2[0]-c1[0]),dy=Math.sign(c2[1]-c1[1]),x1=c1[0]+dx*38,y1=c1[1]+dy*38,x2=c2[0]-dx*38,y2=c2[1]-dy*38;
    h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#5A6873" stroke-width="3" stroke-dasharray="4 5"/>';
    if(ui.mode==='later')h+='<rect data-act="gap" data-a="'+k1+'" data-b="'+k2+'" x="'+(Math.min(x1,x2)-16)+'" y="'+(Math.min(y1,y2)-16)+'" width="'+(Math.abs(x2-x1)+32)+'" height="'+(Math.abs(y2-y1)+32)+'" fill="#009E73" opacity="0.22" rx="6"/>'})});
  linkKeys().forEach(function(k1){var c=ctr(k1),l=S.links[k1],ex='';
    if(weak[k1])ex+='<circle cx="'+c[0]+'" cy="'+c[1]+'" r="44" fill="none" stroke="#1E2A32" stroke-width="3" stroke-dasharray="2 5"/>';
    if(ui.place&&nb(ui.place).indexOf(k1)>=0&&ui.dec[k1]!==undefined)ex+='<circle cx="'+(c[0]+32)+'" cy="'+(c[1]-32)+'" r="14" fill="#fff" stroke="#1E2A32" stroke-width="2"/><text x="'+(c[0]+32)+'" y="'+(c[1]-31)+'" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="600" fill="#1E2A32" pointer-events="none">'+(ui.dec[k1]?'\u2713':'\u2715')+'</text>';
    h+=ring(c[0],c[1],l.dom,strength(k1),ex);
    if(ui.mode==='select'&&!ui.place)h+='<circle data-act="link" data-k="'+k1+'" cx="'+c[0]+'" cy="'+c[1]+'" r="40" fill="transparent"/>'});
  if(a&&ui.mode==='select'){
    if(ui.place){var pc=ctr(ui.place);h+='<circle cx="'+pc[0]+'" cy="'+pc[1]+'" r="27" fill="none" stroke="'+ATTR[a.dom].c+'" stroke-width="18" opacity="0.55"/><circle cx="'+pc[0]+'" cy="'+pc[1]+'" r="36" fill="none" stroke="#1E2A32" stroke-width="3" stroke-dasharray="8 6"/><text class="b-let" x="'+pc[0]+'" y="'+(pc[1]+1)+'">?</text>'}
    else{for(var c=0;c<n;c++)for(var r=0;r<n;r++){k=key(c,r);if(S.links[k])continue;var o=occn(k).length,cc=ctr(k);
      if(!ui.alone&&o>0)h+='<circle cx="'+cc[0]+'" cy="'+cc[1]+'" r="34" fill="#fff" stroke="#1E2A32" stroke-width="2.5" stroke-dasharray="8 6"/><text class="b-let" x="'+cc[0]+'" y="'+(cc[1]+1)+'" style="font-weight:400;fill:#5A6873">'+o+'</text><rect data-act="ask" data-k="'+k+'" x="'+(cc[0]-48)+'" y="'+(cc[1]-48)+'" width="96" height="96" fill="transparent"/>';
      else if(ui.alone&&o===0)h+='<circle cx="'+cc[0]+'" cy="'+cc[1]+'" r="7" fill="#5A6873"/><rect data-act="alone" data-k="'+k+'" x="'+(cc[0]-48)+'" y="'+(cc[1]-48)+'" width="96" height="96" fill="transparent"/>'}}
  }
  var svg=$('board');svg.setAttribute('viewBox','0 0 '+W+' '+W);svg.innerHTML=h;
}
function dot(a){return '<span class="dot" style="background:'+ATTR[a].c+';color:'+(a===4?'#fff':'#1E2A32')+'">'+ATTR[a].k+'</span>'}
function barRows(vals,max,hi,add){return '<div class="bars">'+vals.map(function(v,i){var base=add?v-add[i]:v;
  return '<span>'+ATTR[i].k+'</span><div class="bar"><i style="width:'+(100*v/max)+'%;background:linear-gradient(to right,'+ATTR[i].t+' 0 '+(v?100*base/v:0)+'%,'+ATTR[i].c+' '+(v?100*base/v:0)+'% 100%)"></i></div><span'+(hi===i?' style="font-weight:600"':'')+'>'+v+'</span>'}).join('')+'</div>'}
function drawTurn(){
  var a=asker(),h='<h2>Queue of single links</h2>';
  if(!S.queue.length)h+='<p class="hint">'+(linkKeys().length?'No single links are waiting. Add a card to bring in the next participant.':'Add the first card. The first link is placed at the centre of the board.')+'</p>';
  else{h+='<div class="chips">'+S.queue.map(function(q){var out=q.att>=3;return '<span class="chip'+(q.id===ui.asker?' on':'')+(out?' out':'')+'" '+(out?'':'data-act="asker" data-id="'+q.id+'" tabindex="0" role="button"')+'>'+dot(q.dom)+(q.name?'<b>'+q.name+'</b> ':'')+q.lv.join('')+(out?' (next round)':'')+'</span>'}).join('')+'</div>'}
  if(a&&!ui.place){
    h+='<p>Asking now: '+(a.name?'<b>'+a.name+'</b>, ':'a link ')+'strongest in <b>'+ATTR[a.dom].name+'</b>. Attempt '+(a.att+1)+' of 3.</p>'+barRows(a.lv,9,a.dom)+
      '<p class="hint" style="margin-top:8px">'+(ui.alone?'Choose a dot on the board to set this link down away from any cloth.':'Choose a dashed place on the board. The number shows how many links it would ask.')+'</p>'+
      '<div class="row"><button data-act="alone" class="'+(ui.alone?'on':'')+'">Set down alone</button></div>';
  }
  if(a&&ui.place){
    var ns=occn(ui.place),all=ns.every(function(n){return ui.dec[n]!==undefined});
    h+='<p>'+(a.name?'<b>'+a.name+'</b>':'The link')+' asks for <b>'+cellName(ui.place)+'</b>. Each neighbour accepts or denies.</p>';
    ns.forEach(function(n){var before=unit(n),after=unit(n,a.lv),lo=lowest(before.sums);
      h+='<div class="nbr"><div class="head"><span>'+dot(S.links[n].dom)+' <b>'+cellName(n)+'</b></span><span class="row">'+
        '<button data-act="dec" data-k="'+n+'" data-v="1" class="'+(ui.dec[n]===true?'on':'')+'">Accept</button>'+
        '<button data-act="dec" data-k="'+n+'" data-v="0" class="'+(ui.dec[n]===false?'on':'')+'">Deny</button></span></div>'+
        '<p class="advice">This unit is lowest in '+ATTR[lo].name+'. The new link brings '+ATTR[lo].name+' '+a.lv[lo]+'.</p>'+barRows(after.sums,45,-1,a.lv)+'</div>'});
    h+='<div class="row"><button data-act="confirm" class="primary"'+(all?'':' disabled')+'>Confirm</button><button data-act="acceptall">Accept all</button><button data-act="cancel">Choose another place</button></div>';
  }
  $('p-turn').innerHTML=h;
  var t='';
  if(ui.pending){t='<p style="margin-top:8px">Two or more levels are equal highest. Which is this link\u2019s strongest?</p><div class="row">'+ui.pending.ties.map(function(i){return '<button data-act="tie" data-i="'+i+'">'+ATTR[i].name+'</button>'}).join('')+'<button data-act="tiecancel">Cancel</button></div>'}
  $('tie').innerHTML=t;
}
function drawTools(){
  var h='<h2>Tools for later rounds</h2><div class="row">'+
    '<button data-act="mode" data-m="select" class="'+(ui.mode==='select'?'on':'')+'">Place and inspect</button>'+
    '<button data-act="mode" data-m="break" class="'+(ui.mode==='break'?'on':'')+'">Break a bond</button>'+
    '<button data-act="mode" data-m="later" class="'+(ui.mode==='later'?'on':'')+'">Accept a refused pair</button></div>';
  if(ui.mode==='break'){
    if(ui.bondPick){var p=ui.bondPick;h+='<p style="margin-top:8px">Which link breaks the bond between '+cellName(p.a)+' and '+cellName(p.b)+'?</p><div class="row">'+[p.a,p.b].map(function(k){return '<button data-act="who" data-k="'+k+'"'+(S.broke[k]?' disabled':'')+'>'+cellName(k)+(S.broke[k]?' (already broke one)':'')+'</button>'}).join('')+'<button data-act="whocancel">Cancel</button></div>'}
    else h+='<p class="hint" style="margin-top:8px">Choose a highlighted bond on the board. Each link may break one bond per round.</p>';
  }
  if(ui.mode==='later')h+='<p class="hint" style="margin-top:8px">Choose a highlighted pair on the board to bond two links that refused earlier.</p>';
  h+='<div class="row" style="margin-top:10px"><button data-act="round">Start next round</button><button data-act="shock">Shock now</button><button data-act="undo"'+(undo.length?'':' disabled')+'>Undo</button></div>';
  $('p-tools').innerHTML=h;
}
function drawUnit(){
  var h='<h2>Selected link</h2>',k=ui.sel;
  if(!k||!S.links[k]){h+='<p class="hint">Choose a link on the board to see its card and its unit.</p>'}
  else{var l=S.links[k],u=unit(k),st=strength(k),b=bn(k).length,names=['Cold','Neutral','Wanted'];
    h+='<p>'+dot(l.dom)+' <b>'+cellName(k)+'</b>, strongest in '+ATTR[l.dom].name+', with '+b+(b===1?' bond.':' bonds.')+'</p>'+barRows(l.lv,9,l.dom)+
      '<p style="margin-top:8px">Heat: <b>'+names[st]+'</b>. '+(b?['Its neighbours already hold plenty of '+ATTR[l.dom].name+'.','Its neighbours hold a moderate amount of '+ATTR[l.dom].name+'.','Its neighbours hold little '+ATTR[l.dom].name+'.'][st]:'It has no neighbours to compare with.')+'</p>'+
      '<p style="margin-top:8px">Its unit of '+u.members.length+(u.members.length===1?' link':' links')+(u.dom>=0?' is strongest in <b>'+ATTR[u.dom].name+'</b>.':' has no single strongest attribute.')+'</p>'+barRows(u.sums,45,u.dom);
    if(b===0)h+='<div class="row" style="margin-top:8px"><button data-act="pickup">Pick up this link</button></div>';
  }
  $('p-unit').innerHTML=h;
}
function drawFigs(){
  var ks=linkKeys(),lone=ks.filter(function(k){return bn(k).length===0}).length,gaps=0;
  ks.forEach(function(k1){var p=xy(k1);[[p[0]+1,p[1]],[p[0],p[1]+1]].forEach(function(q){var k2=key(q[0],q[1]);if(S.links[k2]&&!bonded(k1,k2))gaps++})});
  var f=[['Linked',ks.length-lone],['Bonds',Object.keys(S.bonds).length],['Cloths',cloths()],['Weakest links',Object.keys(weakSet()).length],['Single links',S.queue.length+lone],['Refused pairs',gaps]];
  $('figs').innerHTML=f.map(function(x){return '<div class="fig"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('');
  var h='<h2>Separate cloths by round</h2>';
  var hist=S.history.concat([{r:S.round,c:cloths()}]),mx=Math.max(3,Math.max.apply(null,hist.map(function(x){return x.c}))),bw=Math.min(34,380/hist.length),sv='';
  hist.forEach(function(x,i){var bh=60*x.c/mx;sv+='<rect x="'+(i*bw+2)+'" y="'+(66-bh)+'" width="'+(bw-6)+'" height="'+bh+'" fill="#1E2A32"/><text x="'+(i*bw+bw/2-1)+'" y="82" text-anchor="middle" font-size="12" fill="#5A6873">'+x.r+'</text><text x="'+(i*bw+bw/2-1)+'" y="'+(60-bh)+'" text-anchor="middle" font-size="12" fill="#1E2A32">'+x.c+'</text>'});
  h+='<svg viewBox="0 0 400 88" width="100%" role="img" aria-label="Separate cloths by round">'+sv+'</svg>';
  $('p-figs').innerHTML=h;
}
function drawLegend(){
  var h=ATTR.map(function(A,i){return '<div>'+dot(i)+A.name+'</div>'}).join('');
  function mini(st){return '<svg width="34" height="34" viewBox="0 0 80 80"><g transform="translate(-10,-10)">'+ring(50,50,1,st).replace(/<text[^>]*>.*?<\/text>/,'')+'</g></svg>'}
  h+='<div>'+mini(2)+'Wanted</div><div>'+mini(1)+'Neutral</div><div>'+mini(0)+'Cold</div>'+
     '<div><svg width="34" height="34" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#1E2A32" stroke-width="3" stroke-dasharray="2 5"/></svg>Weakest link</div>'+
     '<div><svg width="34" height="14" viewBox="0 0 34 14"><line x1="0" y1="7" x2="34" y2="7" stroke="#1E2A32" stroke-width="7"/></svg>Bond</div>'+
     '<div><svg width="34" height="14" viewBox="0 0 34 14"><line x1="0" y1="7" x2="34" y2="7" stroke="#5A6873" stroke-width="3" stroke-dasharray="4 5"/></svg>Refused pair</div>';
  $('legend').innerHTML=h;
}
function render(){
  $('rnd').textContent=S.round;
  var st=$('status');st.textContent=ui.msg;st.className='status'+(ui.shockMsg?' shock':'');
  $('size').value=String(S.n);$('autoshock').value=String(S.shock);
  $('newgame').textContent=ui.confirmNew?'Press again to clear the board':'Start a new game';
  drawBoard();drawTurn();drawTools();drawUnit();drawFigs();
}

$('board').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;var d=t.dataset;
  if(d.act==='ask'){ui.place=d.k;ui.dec={};say('');render()}
  else if(d.act==='alone'){placeAlone(d.k)}
  else if(d.act==='link'){ui.sel=ui.sel===d.k?null:d.k;render()}
  else if(d.act==='bond'){ui.bondPick={a:d.a,b:d.b};render()}
  else if(d.act==='gap'){snap();S.bonds[bk(d.a,d.b)]=1;say(cellName(d.a)+' and '+cellName(d.b)+' are now bonded.');commit()}
});
document.querySelector('aside').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||t.disabled)return;var d=t.dataset;
  switch(d.act){
    case 'asker':ui.asker=Number(d.id);ui.place=null;ui.dec={};ui.mode='select';ui.bondPick=null;render();break;
    case 'alone':ui.alone=!ui.alone;render();break;
    case 'dec':ui.dec[d.k]=d.v==='1';render();break;
    case 'acceptall':occn(ui.place).forEach(function(n){ui.dec[n]=true});render();break;
    case 'confirm':confirmPlace();break;
    case 'cancel':ui.place=null;ui.dec={};render();break;
    case 'tie':var p=ui.pending;ui.pending=null;addCard(p.lv,Number(d.i),p.name);break;
    case 'tiecancel':ui.pending=null;render();break;
    case 'mode':ui.mode=d.m;ui.bondPick=null;ui.place=null;ui.dec={};render();break;
    case 'who':breakBond(d.k);break;
    case 'whocancel':ui.bondPick=null;render();break;
    case 'round':nextRound();break;
    case 'shock':shock(false);break;
    case 'undo':doUndo();break;
    case 'pickup':if(ui.sel&&S.links[ui.sel]&&bn(ui.sel).length===0){snap();var nm=cellName(ui.sel);liftToQueue(ui.sel);if(!asker())nextAsker();say('The link at '+nm+' was picked up and is single again.');commit()}break;
  }
});
document.querySelector('aside').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.matches('.chip[data-act]')){e.preventDefault();e.target.click()}});
$('addcard').addEventListener('click',submitCard);
$('card').addEventListener('keydown',function(e){if(e.key==='Enter')submitCard()});
$('card').addEventListener('input',function(){$('carderr').textContent=''});
$('uname').addEventListener('keydown',function(e){if(e.key==='Enter'){if($('card').value)submitCard();else $('card').focus()}});
$('uname').addEventListener('input',function(e){var c=cleanName(e.target.value);if(c!==e.target.value)e.target.value=c;$('carderr').textContent=''});
function onPaste(e){var t=(e.clipboardData||window.clipboardData).getData('text'),m=parseMsg(t);if(!m)return;e.preventDefault();$('uname').value=m.name;$('card').value=m.digits;ui.pasteDom=m.dom;$('carderr').textContent='';$('addcard').focus()}
$('uname').addEventListener('paste',onPaste);$('card').addEventListener('paste',onPaste);
$('size').addEventListener('change',function(e){undo=[];S=fresh(Number(e.target.value));ui.asker=null;ui.place=null;ui.sel=null;ui.dec={};say('New game on a board of '+S.n+' by '+S.n+'.');schedule();commit()});
$('autoshock').addEventListener('change',function(e){S.shock=Number(e.target.value);schedule();say(S.shock?'Automatic shock is on, about every '+S.shock+' minutes.':'Automatic shock is off.');commit()});
$('sample').addEventListener('click',function(){for(var i=0;i<8;i++){var lv=[0,0,0,0,0].map(function(){return Math.floor(Math.random()*7)}),d=Math.floor(Math.random()*5);lv[d]=7+Math.floor(Math.random()*3);var gn='guest'+S.nextId;addCard(lv,d,nameTaken(gn)?'':gn)}say('Eight sample cards added.');render()});
$('export').addEventListener('click',function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='chainmail-game-round-'+S.round+'.json';document.body.appendChild(a);a.click();a.remove();say('Game saved to a file.');render()});
$('importbtn').addEventListener('click',function(){$('import').click()});
$('import').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.links||!o.n)throw 0;undo=[];S=o;ui.sel=null;nextAsker();schedule();say('Game loaded from file.');commit()}catch(x){say('That file is not a saved Chainmail game.');render()}};rd.readAsText(f);e.target.value=''});
$('newgame').addEventListener('click',function(){if(!ui.confirmNew){ui.confirmNew=true;render();setTimeout(function(){ui.confirmNew=false;render()},4000);return}ui.confirmNew=false;undo=[];S=fresh(S.n);ui.asker=null;ui.place=null;ui.sel=null;ui.dec={};say('New game. Add the first card.');schedule();commit()});
setInterval(function(){if(S.shock>0&&ui.nextShock&&Date.now()>=ui.nextShock&&!ui.place&&!ui.pending&&!ui.bondPick&&linkKeys().length>=3)shock(true)},1000);

try{var raw=localStorage.getItem(STORE);if(raw){var o=JSON.parse(raw);if(o&&o.links&&o.n)S=o}}catch(e){}
if(!S)S=fresh(11);
nextAsker();schedule();drawLegend();
say(linkKeys().length?'Saved game restored.':'Add the first card to begin.');
render();
})();
</script>
</body>
</html>
